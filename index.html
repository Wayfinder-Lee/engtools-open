    <!-- 部分静态托管配不了 Referrer-Policy 响应头，meta 先兜底（自带 Key 用户的保密心智） -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- 主题三态（light/dark/system，存 vocab_builder_theme）：先于首帧写 data-theme，
         防暗色用户白闪。解析逻辑与 src/utils/theme.ts 保持一致，改一处必须同步另一处。 -->
    <meta name="theme-color" content="#f5f4ee" />
    <script>
      (function () {
        var dark = false;
        try {
          var p = localStorage.getItem('vocab_builder_theme');
          dark = p === 'dark' || (p !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) { /* 存储不可用：亮色兜底 */ }
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#262624');
        }
      })();
    </script>
